services:
  mysql:
    image: mysql:8.0
    container_name: psiclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-psiclinic}
      MYSQL_USER: ${DB_USER:-psiclinic}
      MYSQL_PASSWORD: ${DB_PASSWORD:-psiclinic}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - psiclinic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  psiclinic_mysql_data:
